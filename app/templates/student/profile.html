{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="page-header"><h4><i class="bi bi-person me-2"></i>My Profile</h4></div>
<div class="form-card" style="max-width: 700px;">
    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="text-center mb-4">
            {% if current_user.photo_filename %}
            <img src="{{ url_for('static', filename='uploads/photos/' + current_user.photo_filename) }}" class="rounded-circle mb-2" width="100" height="100" style="object-fit:cover">
            {% else %}<i class="bi bi-person-circle text-muted" style="font-size:5rem"></i>{% endif %}
            <div><input type="file" class="form-control form-control-sm mt-2" name="photo" accept=".jpg,.jpeg,.png" style="max-width:300px;margin:0 auto"></div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3"><label class="form-label">Full Name</label><input class="form-control" value="{{ current_user.full_name }}" disabled></div>
            <div class="col-md-6 mb-3"><label class="form-label">Register Number</label><input class="form-control" value="{{ student.register_number }}" disabled></div>
            <div class="col-md-6 mb-3"><label class="form-label">Department</label><input class="form-control" value="{{ student.department.name if student.department else 'N/A' }}" disabled></div>
            <div class="col-md-6 mb-3"><label class="form-label">Year</label><input class="form-control" value="{{ student.year or '' }}" disabled></div>
            <div class="col-md-6 mb-3"><label class="form-label">Hostel Block</label><input class="form-control" value="{{ student.hostel_block.name if student.hostel_block else 'N/A' }}" disabled></div>
            <div class="col-md-6 mb-3"><label class="form-label">Room</label><input class="form-control" value="{{ student.room.room_number if student.room else 'N/A' }}" disabled></div>
        </div>
        <hr>
        <h6>Editable Details</h6>
        <div class="row">
            <div class="col-md-6 mb-3"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ current_user.phone or '' }}"></div>
            <div class="col-md-6 mb-3"><label class="form-label">Blood Group</label>
                <select class="form-select" name="blood_group">
                    {% for bg in ['','A+','A-','B+','B-','O+','O-','AB+','AB-'] %}
                    <option {% if student.blood_group == bg %}selected{% endif %}>{{ bg }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3"><label class="form-label">Parent Name</label><input class="form-control" name="parent_name" value="{{ student.parent_name or '' }}"></div>
            <div class="col-md-6 mb-3"><label class="form-label">Parent Phone</label><input class="form-control" name="parent_phone" value="{{ student.parent_phone or '' }}"></div>
            <div class="col-md-6 mb-3"><label class="form-label">Parent Email</label><input class="form-control" name="parent_email" value="{{ student.parent_email or '' }}"></div>
            <div class="col-12 mb-3"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="2">{{ student.address or '' }}</textarea></div>
        </div>
        <button class="btn btn-primary"><i class="bi bi-save me-1"></i>Save Changes</button>
    </form>
</div>
{% endblock %}
