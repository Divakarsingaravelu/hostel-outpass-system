<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Hostel Outpass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head><body>
<div class="login-container">
    <div class="login-card">
        <div class="logo-section"><i class="bi bi-envelope"></i><h4>Reset Password</h4></div>
        {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for c, m in messages %}<div class="alert alert-{{ c }} py-2 small">{{ m }}</div>{% endfor %}{% endif %}{% endwith %}
        <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3"><label class="form-label">Register No / Email</label>
                <input type="text" class="form-control" name="username" required></div>
            <button class="btn btn-primary w-100">Send Reset Link</button>
        </form>
        <div class="text-center mt-3"><a href="{{ url_for('auth.login') }}" class="small">Back to Login</a></div>
    </div>
</div></body></html>
