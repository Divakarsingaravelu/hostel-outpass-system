{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="container" style="max-width: 500px; margin-top: 3rem;">
    <div class="form-card">
        <h4 class="mb-4"><i class="bi bi-key me-2"></i>Change Password</h4>
        {% if current_user.must_change_password %}
        <div class="alert alert-warning"><i class="bi bi-exclamation-triangle me-2"></i>You must change your default password before continuing.</div>
        {% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Current Password</label>
                <input type="password" class="form-control" name="current_password" required>
            </div>
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" name="new_password" required minlength="8">
                <div class="form-text">Minimum 8 characters</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" class="form-control" name="confirm_password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Change Password</button>
        </form>
    </div>
</div>
{% endblock %}
